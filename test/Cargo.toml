[package]
name = "localforge-tests"
version = "0.1.0"
edition = "2024"
publish = false

# Este crate es local y no forma parte del workspace de la app.
# Se ignora en git (ver .gitignore): el repositorio solo versiona el código.
[workspace]

[dependencies]
shared = { path = "../crates/shared" }
controller = { path = "../crates/controller" }
llm_engine = { path = "../crates/llm_engine" }
ui = { path = "../crates/ui" }
audio_engine = { path = "../crates/audio_engine" }
stt = { path = "../crates/stt" }
tts = { path = "../crates/tts" }
hound = "3.5"
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt", "time"] }
