      <text x="879" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="600" fill="#f0eeff">Kokoro ONNX</text>
      <text x="879" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#817d99">WAV · 24 kHz</text>
      <text x="879" y="215" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" fill="#fbbf24" fill-opacity="0.85">tts</text>
    </g>

    <!-- node 6: speakers -->
    <g>
      <rect x="983" y="68" width="164" height="156" rx="18" fill="#13111f" stroke="#2a2748"/>
      <text x="1001" y="92" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.4" fill="#6f6b8a">SALIDA</text>
      <text x="1129" y="92" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" fill="#22d3ee">CPAL</text>
      <g transform="translate(1065 126)" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-18 -7h8l10 -9v32l-10 -9h-8z"/>
        <path d="M8 -8a12 12 0 0 1 0 16"/>
        <path d="M14 -14a21 21 0 0 1 0 28"/>
