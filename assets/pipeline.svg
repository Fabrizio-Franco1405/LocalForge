<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="Pipeline de voz de LocalForge: micrófono, VAD, whisper.cpp, llama.cpp, Kokoro y altavoces">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090f"/>
      <stop offset="1" stop-color="#100c1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#4c4674"/>
    </marker>
    <clipPath id="frame"><rect width="1200" height="310" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="310" fill="url(#bg)"/>
    <rect width="1200" height="310" fill="url(#grid)"/>
    <circle cx="600" cy="0" r="420" fill="url(#glow)"/>

    <text x="53" y="42" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="3.5" fill="#8b7cff">VOICE PIPELINE · MANOS LIBRES</text>
    <text x="1147" y="42" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" fill="#6f6b8a">VAD → STT → LLM → TTS</text>

    <!-- connectors -->
    <g stroke="#4c4674" stroke-width="1.6">
      <line x1="219" y1="146" x2="235" y2="146" marker-end="url(#arrow)"/>
      <line x1="405" y1="146" x2="421" y2="146" marker-end="url(#arrow)"/>
      <line x1="591" y1="146" x2="607" y2="146" marker-end="url(#arrow)"/>
      <line x1="777" y1="146" x2="793" y2="146" marker-end="url(#arrow)"/>
      <line x1="963" y1="146" x2="979" y2="146" marker-end="url(#arrow)"/>
    </g>

    <!-- node 1: mic -->
    <g>
      <rect x="53" y="68" width="164" height="156" rx="18" fill="#13111f" stroke="#2a2748"/>
      <text x="71" y="92" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.4" fill="#6f6b8a">CAPTURA</text>
      <text x="199" y="92" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" fill="#22d3ee">CPAL</text>
      <g transform="translate(135 126)" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round">
        <rect x="-7" y="-16" width="14" height="24" rx="7"/>
        <path d="M-12 0a12 12 0 0 0 24 0"/>
        <path d="M0 12v7"/>
        <path d="M-8 19h16"/>
      </g>
      <text x="135" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="600" fill="#f0eeff">Micrófono</text>
      <text x="135" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#817d99">48 kHz estéreo</text>
      <text x="135" y="215" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" fill="#22d3ee" fill-opacity="0.85">audio_engine</text>
    </g>

