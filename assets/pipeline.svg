      <text x="385" y="92" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" fill="#22d3ee">WEBRTC</text>
      <g transform="translate(321 126)" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path d="M-16 -5v10"/>
        <path d="M-8 -12v24"/>
        <path d="M0 -19v38"/>
        <path d="M8 -10v20"/>
        <path d="M16 -4v8"/>
