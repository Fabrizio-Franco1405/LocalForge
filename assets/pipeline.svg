      <text x="443" y="92" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.4" fill="#6f6b8a">STT</text>
      <text x="571" y="92" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" fill="#8b6cff">VULKAN</text>
      <g transform="translate(507 126)" stroke="#8b6cff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
