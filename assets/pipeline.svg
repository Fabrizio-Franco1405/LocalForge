      <g transform="translate(879 126)" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-17 -6h7l9 -8v28l-9 -8h-7z"/>
        <path d="M7 -6a9 9 0 0 1 0 12"/>
        <path d="M12 -11a16 16 0 0 1 0 22"/>
