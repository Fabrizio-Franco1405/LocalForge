      <text x="1065" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="600" fill="#f0eeff">Altavoces</text>
      <text x="1065" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#817d99">playback sin locks</text>
      <text x="1065" y="215" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" fill="#22d3ee" fill-opacity="0.85">audio_engine</text>
