      <text x="507" y="195" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#817d99">WAV · 16 kHz mono</text>
      <text x="507" y="215" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10" fill="#8b6cff" fill-opacity="0.9">stt</text>
