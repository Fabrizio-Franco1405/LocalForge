      <text x="629" y="92" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.4" fill="#6f6b8a">LLM</text>
      <text x="757" y="92" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="9.5" fill="#a78bfa">VULKAN</text>
      <g transform="translate(693 126)" stroke="#a78bfa" stroke-width="2" fill="none" stroke-linejoin="round">
