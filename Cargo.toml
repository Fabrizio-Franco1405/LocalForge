[package]
name = "localforge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Harness local para conectar LLM, voz y 3D sin salir de tu máquina"

[dependencies]
gpui-kit = { workspace = true }
shared = { workspace = true }
ui = { workspace = true }
controller = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[workspace]
resolver = "3"
members = [
    "crates/controller",
    "crates/llm_engine",
    "crates/audio_engine",
    "crates/scene3d",
    "crates/stt",
    "crates/tts",
    "crates/ui",
    "crates/shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
shared = { path = "crates/shared" }
ui = { path = "crates/ui" }
controller = { path = "crates/controller" }
scene3d = { path = "crates/scene3d" }
llm_engine = { path = "crates/llm_engine" }
stt = { path = "crates/stt" }
tts = { path = "crates/tts" }
audio_engine = { path = "crates/audio_engine" }

gpui-kit = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.9"
dirs = "7"
sysinfo = "0.31"
hound = "3.5"
cpal = "0.18"
webrtc-vad = "0.4"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "process",
    "io-util",
    "time",
    "sync",
    "macros",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
futures-util = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
